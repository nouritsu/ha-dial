name: Update flake.lock

on:
  schedule:
    # Mondays
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix flake update
      # GitHub runs no workflows on a pull request that a workflow opens, so the
      # update is checked before it's opened
      - run: nix flake check -L
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: update-flake-lock
          commit-message: "chore: update flake.lock"
          title: "chore: update flake.lock"
          body: "`nix flake update`, which passed `nix flake check` before this was opened."
