name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# a newer push to the same branch makes an unfinished run moot
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      # both firmware builds, the formatting check and the flasher's tests
      - run: nix flake check -L
