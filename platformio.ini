[platformio]
default_envs = dial

[env:dial]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = m5stack-stamps3
framework = espidf
board_build.partitions = partitions.csv
board_upload.flash_size = 8MB
board_upload.after_reset = watchdog_reset
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; ha or tapo; the flake builds both, as .#ha and .#tapo
board_build.cmake_extra_args = -DDIAL_BACKEND=ha
