; copy to secrets.ini (gitignored); values are taken verbatim, without quotes
[secrets]
wifi_ssid =
wifi_password =
; a file name in src/backends: ha talks to Home Assistant, tapo to the bulbs
backend = ha
ha_host = 192.168.178.128
ha_port = 8123
; long-lived access token of the `dial` Home Assistant user
ha_token =
; bulb addresses separated by commas (give them fixed DHCP leases), and the
; TP-Link account they were set up with in the Tapo app
tapo_hosts =
tapo_username =
tapo_password =
; optional: a static address skips DHCP on every wake; all four are dotted
; addresses, so subnet is a netmask like 255.255.255.0 rather than a prefix length
static_ip =
gateway =
subnet =
dns =
