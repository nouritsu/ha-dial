; copy to secrets.ini (gitignored); values are taken verbatim, without quotes.
; tools/flash.py writes them to the Dial's secrets partition when it flashes,
; so they stay out of the firmware and the Nix store
[secrets]
wifi_ssid =
wifi_password =
; the ha firmware: Home Assistant
ha_host = 192.168.178.128
ha_port = 8123
; long-lived access token of the `dial` Home Assistant user
ha_token =
; the tapo firmware: bulb addresses separated by commas (give them fixed DHCP
; leases), and the TP-Link account they were set up with in the Tapo app
tapo_hosts =
tapo_username =
tapo_password =
; optional: a static address skips DHCP on every wake; all four are dotted
; addresses, so subnet is a netmask like 255.255.255.0 rather than a prefix length
static_ip =
gateway =
subnet =
dns =
